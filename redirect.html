<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pescaderia Agustin</title>
    <meta http-equiv="refresh" content="0; url=https://agustinpescaderia.github.io/d/">
    <script type="text/javascript">
        window.location.replace("https://agustinpescaderia.github.io/d/");
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0f0f23;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .box {
            background: #1a1a3e;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        h1 { font-size: 20px; margin-bottom: 12px; color: #667eea; }
        p { font-size: 14px; color: #a0a0c0; margin-bottom: 20px; }
        a {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
        }
        .spinner {
            width: 30px; height: 30px;
            border: 3px solid rgba(102,126,234,0.3);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h1>Pescaderia Agustin</h1>
        <p>Redirigiendo al sitio oficial...</p>
        <a href="https://agustinpescaderia.github.io/d/">Entrar ahora</a>
    </div>
</body>
</html>
